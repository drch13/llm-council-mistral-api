name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.version.outputs.next_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Install git-cliff
        run: npm install -g git-cliff@2.14.2

      - name: Compute next version (SemVer bump from Conventional Commits since last tag)
        id: version
        run: echo "next_version=$(git cliff --bumped-version)" >> "$GITHUB_OUTPUT"

      - name: Regenerate CHANGELOG.md (Keep a Changelog, prepend new section)
        run: git cliff --unreleased --tag "v${{ steps.version.outputs.next_version }}" --prepend CHANGELOG.md

      - name: Commit changelog and push version tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add CHANGELOG.md
          git commit -m "docs: release v${{ steps.version.outputs.next_version }} [skip ci]"
          git tag "v${{ steps.version.outputs.next_version }}"
          git push origin master
          git push origin "v${{ steps.version.outputs.next_version }}"

  build-exe:
    runs-on: windows-latest
    needs: changelog
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Set up Python project
        run: uv sync

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Package executable with PyInstaller
        run: uv run --with pyinstaller pyinstaller --onefile --name LLM-Council-v${{ needs.changelog.outputs.next_version }} --collect-all uvicorn --add-data "frontend/dist;dist" --add-data "backend/prompts;backend/prompts" run_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLM-Council-windows-release
          path: dist/LLM-Council-v${{ needs.changelog.outputs.next_version }}.exe
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: [changelog, build-exe]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LLM-Council-windows-release
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.changelog.outputs.next_version }}
          name: v${{ needs.changelog.outputs.next_version }} — LLM Council (Windows executable)
          files: dist/LLM-Council-v${{ needs.changelog.outputs.next_version }}.exe
