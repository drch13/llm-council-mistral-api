name: Build Windows executable

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Set up Python project
        run: uv sync

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Package executable with PyInstaller
        run: uv run --with pyinstaller pyinstaller --onefile --name LLM-Council --collect-all uvicorn --add-data "frontend/dist;dist" run_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLM-Council-windows
          path: dist/LLM-Council.exe
          retention-days: 1
